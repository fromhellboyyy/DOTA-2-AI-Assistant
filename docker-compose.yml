name: ${COMPOSE_PROJECT_NAME:-dota-2-ai-assistant}

include:
  - path: observability/compose.yaml

x-telemetry-env: &telemetry-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-5000}
  OTEL_RESOURCE_ATTRIBUTES: service.version=${APP_VERSION:-0.1.0},deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:-dev}

x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *telemetry-env
      OTEL_SERVICE_NAME: api
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/app
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672/
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-20}
      RETRY_AFTER_SECONDS: "5"
      CONCURRENCY_LIMIT: "1"
      WORKER_REPLICAS: "1"
      INFERENCE_DELAY_SEC: "0.5"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: *app-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: [ "python", "-m", "app.worker" ]
    stop_grace_period: 30s
    environment:
      <<: *telemetry-env
      OTEL_SERVICE_NAME: worker
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/app
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672/
      INFERENCE_DELAY_SEC: "0.5"
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-20}
      PREFETCH_COUNT: "1"
      CONCURRENCY_LIMIT: "1"
      MAX_RETRIES: "3"
      WORKER_HEALTH_PORT: "8081"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_started
    logging: *app-logging

  producer:
    build: .
    profiles: [ "tools" ]
    command: [ "python", "-m", "app.producer" ]
    environment:
      <<: *telemetry-env
      OTEL_SERVICE_NAME: source
      INFERENCE_DELAY_SEC: "0.5"
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-20}
      RABBITMQ_URL: amqp://rabbit:rabbit@rabbitmq:5672/
      SCORING_CSV: ml/data/matches.csv
      PUBLISH_RETRY_DELAY_SEC: "0.5"
      PUBLISH_MAX_BACKOFF_SEC: "5.0"
    volumes:
      - ./ml/data:/app/ml/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    logging: *app-logging

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: pgsty/silo@sha256:aaac6bce13eb99316b3c88bd20143fc3c38ab607585256a411a095c44ee57f62
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir "psycopg[binary]" boto3 &&
        mlflow server \
          --backend-store-uri postgresql://mlflow:mlflow@mlflow-db:5432/mlflow \
          --default-artifact-root s3://mlflow/ \
          --host 0.0.0.0 \
          --port 5000 \
          --allowed-hosts "*"

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mlflow_pgdata:
  minio_data:
  rabbitmq_data: