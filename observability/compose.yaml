services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.116.1}
    profiles: [traces, metrics, observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      GOMEMLIMIT: 150MiB
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    mem_limit: 192m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.6.1}
    profiles: [traces, observability]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.3.2}
    profiles: [logs, observability]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    mem_limit: 320m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  vector:
    image: timberio/vector:${VECTOR_VERSION:-0.43.1-alpine}
    profiles: [logs, observability]
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-dota-2-ai-assistant}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector
    mem_limit: 96m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8686/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  victoria-metrics:
    image: victoriametrics/victoria-metrics:${VICTORIAMETRICS_VERSION:-v1.105.0}
    profiles: [metrics, observability]
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=3d"
      - "-search.latencyOffset=2s"
      - "-httpListenAddr=:8428"
    volumes:
      - vm_data:/storage
    ports:
      - "8428:8428"
    mem_limit: 192m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_WAL: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  tempo_data:
  loki_data:
  vector_data:
  vm_data:
  grafana_data: